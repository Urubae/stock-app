<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주식AI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>주식 AI 대시보드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root {
  --bg:#0a0c10;--surface:#111318;--surface2:#181c24;
  --border:#1e2330;--accent:#00e5ff;--accent2:#ff4466;
  --accent3:#00ff88;--text:#e8eaf0;--text2:#7a8099;
  --up:#00ff88;--down:#ff4466;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
.header{padding:14px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.header h1{font-size:17px;font-weight:700;color:var(--accent);}
.clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);}
.market-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;}
.market-open{background:rgba(0,255,136,0.15);color:var(--up);border:1px solid rgba(0,255,136,0.3);}
.market-close{background:rgba(122,128,153,0.15);color:var(--text2);border:1px solid rgba(122,128,153,0.2);}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.page{display:none;padding:12px 14px;}
.page.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.card-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}

/* 종목 */
.stock-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.stock-item:last-child{border-bottom:none;}
.sname{font-size:14px;font-weight:500;}
.scode{font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.sprice{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;}
.schg{font-size:11px;font-family:'JetBrains Mono',monospace;text-align:right;margin-top:2px;}
.up{color:var(--up);}.down{color:var(--down);}.flat{color:var(--text2);}

/* 뉴스 */
.news-item{padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.news-item:last-child{border-bottom:none;}
.news-title{font-size:13px;line-height:1.5;margin-bottom:5px;}
.news-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.news-src{font-size:10px;color:var(--text2);}
.news-time{font-size:10px;color:var(--text2);}
.badge{padding:2px 7px;border-radius:3px;font-size:10px;}
.badge.hot{background:rgba(255,170,0,0.15);color:#ffaa00;}
.badge.pos{background:rgba(0,255,136,0.1);color:var(--up);}
.badge.neg{background:rgba(255,68,102,0.1);color:var(--down);}
.badge.neu{background:rgba(122,128,153,0.1);color:var(--text2);}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:none;transition:all 0.2s;font-weight:500;width:100%;margin-bottom:10px;}
.btn-primary{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.35);color:var(--accent);}
.btn-primary:active{background:rgba(0,229,255,0.25);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}

/* 입력 */
.input-row{display:flex;gap:8px;margin-top:12px;}
.stock-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;}
.stock-input:focus{border-color:var(--accent);}
.btn-add{background:rgba(0,229,255,0.15);border:1px solid rgba(0,229,255,0.3);color:var(--accent);padding:9px 14px;border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;font-weight:600;}

/* 로딩 */
.loading{display:flex;flex-direction:column;align-items:center;padding:28px;gap:10px;color:var(--text2);font-size:12px;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 0.7s linear infinite;display:inline-block;}

.del-btn{color:var(--text2);font-size:18px;padding:0 4px;cursor:pointer;background:none;border:none;line-height:1;}
.empty{color:var(--text2);font-size:13px;padding:14px 0;text-align:center;}
.err{color:var(--down);font-size:12px;padding:10px;background:rgba(255,68,102,0.08);border-radius:8px;}
.last-update{font-size:11px;color:var(--text2);text-align:center;padding:6px 0;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📡 주식 대시보드</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span id="market-badge" class="market-badge market-close">장외</span>
      <span class="clock" id="clock"></span>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('watchlist',this)">📈 관심종목</div>
  <div class="tab" onclick="switchTab('news',this)">📰 뉴스</div>
  <div class="tab" onclick="switchTab('market',this)">🌏 시장</div>
</div>

<!-- 관심종목 -->
<div id="tab-watchlist" class="page active">
  <div class="card">
    <div class="card-title">⭐ 관심 종목</div>
    <div id="stock-list"></div>
    <div class="input-row">
      <input class="stock-input" id="stock-input" placeholder="종목코드 입력 (예: 005930)" onkeydown="if(event.key==='Enter')addStock()">
      <button class="btn-add" onclick="addStock()">추가</button>
    </div>
  </div>
  <button class="btn btn-primary" id="btn-refresh" onclick="refreshPrices()">
    <span id="refresh-icon">🔄</span> 시세 새로고침
  </button>
  <div id="last-update" class="last-update"></div>
</div>

<!-- 뉴스 -->
<div id="tab-news" class="page">
  <button class="btn btn-primary" onclick="loadNews()">🔄 뉴스 새로고침</button>
  <div class="card">
    <div class="card-title">📰 주식 최신 뉴스</div>
    <div id="news-content"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>
</div>

<!-- 시장 -->
<div id="tab-market" class="page">
  <button class="btn btn-primary" onclick="loadMarket()">🔄 시장 현황 새로고침</button>
  <div class="card">
    <div class="card-title">🌏 국내 시장 지수</div>
    <div id="market-content"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="card-title">🌎 해외 시장</div>
    <div id="overseas-content"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>
</div>

<script>
// 시계
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('ko-KR');
  const h = now.getHours(), m = now.getMinutes();
  const isOpen = (h > 9 || (h===9&&m>=0)) && (h < 15 || (h===15&&m<=30));
  const badge = document.getElementById('market-badge');
  badge.textContent = isOpen ? '장중' : '장외';
  badge.className = 'market-badge ' + (isOpen ? 'market-open' : 'market-close');
}
setInterval(tick, 1000); tick();

// 탭
function switchTab(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'news') loadNews();
  if (name === 'market') loadMarket();
}

// 관심종목 (종목코드 기반)
let watchlist = JSON.parse(localStorage.getItem('wl2') || '[]');
if (!watchlist.length) {
  watchlist = [
    {name:'SK텔레콤', code:'017670'},
    {name:'삼성전자', code:'005930'},
    {name:'카카오', code:'035720'}
  ];
}
function saveWL() { localStorage.setItem('wl2', JSON.stringify(watchlist)); }

function renderStocks() {
  const el = document.getElementById('stock-list');
  if (!watchlist.length) { el.innerHTML = '<div class="empty">종목코드를 추가해주세요</div>'; return; }
  el.innerHTML = watchlist.map((s,i) => `
    <div class="stock-item">
      <div>
        <div class="sname">${s.name}</div>
        <div class="scode">${s.code}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="text-align:right;">
          <div class="sprice ${s.chg>0?'up':s.chg<0?'down':'flat'}">${s.price ? Number(s.price).toLocaleString()+'원' : '-'}</div>
          <div class="schg ${s.chg>0?'up':s.chg<0?'down':'flat'}">${s.chg!=null?(s.chg>0?'▲':'▼')+Math.abs(s.chg)+'%':''}</div>
        </div>
        <button class="del-btn" onclick="removeStock(${i})">×</button>
      </div>
    </div>`).join('');
}

function addStock() {
  const inp = document.getElementById('stock-input');
  const code = inp.value.trim().replace(/\D/g,'').padStart(6,'0');
  if (!code || code.length !== 6) { alert('6자리 종목코드를 입력하세요\n예) 삼성전자: 005930'); return; }
  if (watchlist.find(s => s.code === code)) { inp.value=''; return; }
  watchlist.push({name: code, code});
  saveWL(); renderStocks(); inp.value='';
  refreshPrices();
}

function removeStock(i) { watchlist.splice(i,1); saveWL(); renderStocks(); }

// Yahoo Finance로 주가 조회 (무료, CORS 프록시 사용)
async function fetchPrice(code) {
  const symbol = code + '.KS';
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy);
  const data = await res.json();
  const meta = data.chart.result[0].meta;
  const price = meta.regularMarketPrice;
  const prev = meta.previousClose || meta.chartPreviousClose;
  const chg = prev ? +((price - prev) / prev * 100).toFixed(2) : 0;
  const name = meta.shortName || meta.symbol;
  return { price, chg, name };
}

async function refreshPrices() {
  const btn = document.getElementById('btn-refresh');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.className = 'spin'; icon.textContent = '⟳';

  await Promise.all(watchlist.map(async (s, i) => {
    try {
      const d = await fetchPrice(s.code);
      watchlist[i].price = d.price;
      watchlist[i].chg = d.chg;
      if (d.name && s.code === s.name) watchlist[i].name = d.name;
    } catch(e) { /* 실패시 기존값 유지 */ }
  }));

  saveWL(); renderStocks();
  document.getElementById('last-update').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');
  btn.disabled = false;
  icon.className = ''; icon.textContent = '🔄';
}

// 네이버 금융 뉴스 RSS
async function loadNews() {
  document.getElementById('news-content').innerHTML = '<div class="loading"><div class="spinner"></div>뉴스 불러오는 중...</div>';
  try {
    const rssUrl = 'https://finance.naver.com/news/news_list.naver?mode=RSS&category=stock';
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(proxy);
    const text = await res.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');
    const items = Array.from(xml.querySelectorAll('item')).slice(0, 20);

    if (!items.length) throw new Error('뉴스 없음');

    // 관심종목 키워드
    const keywords = watchlist.map(s => s.name).filter(n => n.length > 2);

    document.getElementById('news-content').innerHTML = items.map(item => {
      const title = item.querySelector('title')?.textContent || '';
      const link = item.querySelector('link')?.textContent || '#';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const date = new Date(pubDate);
      const timeStr = isNaN(date) ? '' : date.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});

      // 관심종목 매칭
      const matched = keywords.find(k => title.includes(k));
      // 호재/악재 키워드
      const isPos = /급등|상승|호재|매수|신고가|흑자|상한가|돌파/.test(title);
      const isNeg = /급락|하락|악재|매도|신저가|적자|하한가|폭락/.test(title);
      const sentiment = matched ? (isPos ? 'pos' : isNeg ? 'neg' : 'hot') : 'neu';

      return `<div class="news-item" onclick="window.open('${link}','_blank')">
        <div class="news-title">${title}</div>
        <div class="news-meta">
          ${matched ? `<span class="badge hot">${matched}</span>` : ''}
          <span class="news-time">${timeStr}</span>
          <span class="badge ${sentiment}">${isPos?'호재':isNeg?'악재':matched?'관련':'일반'}</span>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    // RSS 실패 시 네이버 금융 뉴스 직접 링크
    document.getElementById('news-content').innerHTML = `
      <div class="err">RSS 로드 실패 - 네이버 금융으로 이동합니다</div>
      ${watchlist.map(s=>`
        <div class="news-item" onclick="window.open('https://finance.naver.com/item/news.naver?code=${s.code}','_blank')">
          <div class="news-title">📰 ${s.name} 뉴스 보기</div>
          <div class="news-meta"><span class="badge hot">${s.code}</span></div>
        </div>`).join('')}
      <div class="news-item" onclick="window.open('https://finance.naver.com/news/','_blank')">
        <div class="news-title">📰 전체 주식 뉴스 보기</div>
      </div>`;
  }
}

// 시장 지수 (Yahoo Finance)
async function loadMarket() {
  document.getElementById('market-content').innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
  document.getElementById('overseas-content').innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';

  const domestic = [
    {symbol:'^KS11', name:'KOSPI'},
    {symbol:'^KQ11', name:'KOSDAQ'},
  ];
  const overseas = [
    {symbol:'^GSPC', name:'S&P 500'},
    {symbol:'^IXIC', name:'NASDAQ'},
    {symbol:'^N225', name:'닛케이'},
    {symbol:'000001.SS', name:'상하이'},
  ];

  async function fetchIndex(symbol) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy);
    const data = await res.json();
    const meta = data.chart.result[0].meta;
    const price = meta.regularMarketPrice;
    const prev = meta.previousClose || meta.chartPreviousClose;
    const chg = prev ? +((price-prev)/prev*100).toFixed(2) : 0;
    return {price, chg};
  }

  function indexHTML(list, results) {
    return list.map((item,i) => {
      const d = results[i];
      if (!d) return '';
      return `<div class="stock-item">
        <div class="sname">${item.name}</div>
        <div style="text-align:right;">
          <div class="sprice ${d.chg>0?'up':d.chg<0?'down':'flat'}">${d.price.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
          <div class="schg ${d.chg>0?'up':d.chg<0?'down':'flat'}">${d.chg>0?'▲':'▼'}${Math.abs(d.chg)}%</div>
        </div>
      </div>`;
    }).join('');
  }

  try {
    const domRes = await Promise.all(domestic.map(d => fetchIndex(d.symbol).catch(()=>null)));
    document.getElementById('market-content').innerHTML = indexHTML(domestic, domRes);
  } catch(e) {
    document.getElementById('market-content').innerHTML = '<div class="err">로드 실패</div>';
  }

  try {
    const ovsRes = await Promise.all(overseas.map(d => fetchIndex(d.symbol).catch(()=>null)));
    document.getElementById('overseas-content').innerHTML = indexHTML(overseas, ovsRes);
  } catch(e) {
    document.getElementById('overseas-content').innerHTML = '<div class="err">로드 실패</div>';
  }
}

// 초기화
renderStocks();
refreshPrices();

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
</body>
</html>
